name: Publish eyrie-popup to PyPI

on:
  push:
    tags:
      - 'eyrie-popup-v*'

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/eyrie-popup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Extract version from release tag
        id: version
        run: |
          # Extract version from tag (e.g., eyrie-popup-v0.2.1 -> 0.2.1)
          VERSION=${GITHUB_REF#refs/tags/eyrie-popup-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing eyrie-popup version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build
          python -m pip install --upgrade twine

      - name: Verify version matches release
        run: |
          # Check that the version in __version__.py matches the release tag
          PACKAGE_VERSION=$(grep '__version__ = ' popup/__version__.py | cut -d'"' -f2)
          RELEASE_VERSION="${{ steps.version.outputs.version }}"
          
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Package version: $PACKAGE_VERSION"
            echo "Release tag version: $RELEASE_VERSION"
            echo "Please ensure the version in popup/__version__.py matches the release tag."
            exit 1
          fi
          
          echo "✅ Version verified: $PACKAGE_VERSION"

      - name: Build package
        run: |
          python -m build
          echo "Built eyrie-popup package version: ${{ steps.version.outputs.version }}"

      - name: Check package contents
        run: |
          python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "Publishing eyrie-popup version ${{ steps.version.outputs.version }} to PyPI..."
          python -m twine upload dist/*

      - name: Publish summary
        run: |
          echo "## PyPI Package Published Successfully! 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`eyrie-popup==${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pip install eyrie-popup==${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "popup --help" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY