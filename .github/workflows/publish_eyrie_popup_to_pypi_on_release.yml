name: Publish eyrie-popup to PyPI

on:
  push:
    tags:
      - 'eyrie-popup-v*'

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/eyrie-popup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.0
        with:
          fetch-depth: 0

      - name: Extract version from release tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/eyrie-popup-v}
          echo "POPUP_TAG=$VERSION" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build
          python -m pip install --upgrade twine

      - name: Verify version matches release
        run: |
          PACKAGE_VERSION=$(grep '__version__ = ' popup/__version__.py | cut -d'"' -f2)
          RELEASE_VERSION="${{ env.POPUP_TAG }}"
          
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch!"
            echo "Package version: $PACKAGE_VERSION"
            echo "Release tag version: $RELEASE_VERSION"
            echo "Please ensure the version in popup/__version__.py matches the release tag."
            exit 1
          fi
          
          echo "Version verified: $PACKAGE_VERSION"

      - name: Build package
        run: |
          python -m build

      - name: Check package contents
        run: |
          python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload dist/*
