name: Publish eyrie-popup to DockerHub

on:
  push:
    tags:
      - 'eyrie-popup-v*'

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.0
        with:
          fetch-depth: 0

      - name: Wait for PyPI to publish package
        run: sleep 60s
        shell: bash

      - name: Extract version from release tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/eyrie-popup-v}
          echo "POPUP_TAG=$VERSION" >> $GITHUB_ENV
          echo "POPUP_TAG_LATEST=latest" >> $GITHUB_ENV

      - name: Verify version matches release
        run: |
          PACKAGE_VERSION=$(grep '__version__ = ' tools/eyrie-popup/popup/__version__.py | cut -d'"' -f2)
          RELEASE_VERSION="${{ env.POPUP_TAG }}"
          
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch!"
            echo "Package version: $PACKAGE_VERSION"
            echo "Release tag version: $RELEASE_VERSION"
            echo "Please ensure the version in popup/__version__.py matches the release tag."
            exit 1
          fi
          
          echo "Version verified: $PACKAGE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to DockerHub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: clinicalgenomicslund/eyrie-popup
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.POPUP_TAG }}
          labels: |
            org.opencontainers.image.title=eyrie-popup
            org.opencontainers.image.description=Pipeline Output Processor and UPloader for Eyrie - parsing sequencing analysis results
            org.opencontainers.image.version=${{ env.POPUP_TAG }}
            org.opencontainers.image.source=https://github.com/clinicalgenomicslund/eyrie
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.8
        with:
          context: tools/eyrie-popup
          file: tools/eyrie-popup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: clinicalgenomicslund/eyrie-popup
          readme-filepath: tools/eyrie-popup/README.md
