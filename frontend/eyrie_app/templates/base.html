<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eyrie Sample Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('main.serve_shared_static', filename='css/styles.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% from 'navbar.html' import navbar %}
    {{ navbar(current_user) }}

    {% block content %}{% endblock %}

    <script>
        // API base URL
        window.API_BASE = '{{ url_for("main.get_samples").replace("/samples", "") }}';

        // Shared authentication functions
        async function loadCurrentUser() {
            try {
                const response = await fetch('{{ url_for("main.current_user_api") }}', {
                    credentials: 'include'
                });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('currentUsername').textContent = user.username;

                    // Show/hide admin button based on role
                    const adminButton = document.getElementById('adminButton');
                    if (user.role !== 'admin') {
                        adminButton.style.display = 'none';
                    }

                    {% block user_loaded %}{% endblock %}
                } else {
                    {% block auth_failed %}
                    document.getElementById('currentUsername').textContent = 'Unknown';
                    {% endblock %}
                }
            } catch (error) {
                console.error('Failed to load user:', error);
                document.getElementById('currentUsername').textContent = 'Unknown';
            }
        }

        async function logout() {
            try {
                await fetch('{{ url_for("login.logout") }}', { method: 'POST' });
                window.location.href = '{{ url_for("login.login") }}';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '{{ url_for("login.login") }}';
            }
        }

        // Initialize shared functionality
        document.addEventListener('DOMContentLoaded', function() {
            loadCurrentUser();
            {% block dom_ready %}{% endblock %}
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('main.serve_shared_static', filename='js/shared.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
