<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eyrie Sample Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('login.serve_shared_static_endpoint', filename='css/styles.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% from 'navbar.html' import navbar %}
    {{ navbar(current_user) }}

    {% block content %}{% endblock %}

    <script>
        // Initialize shared functionality
        document.addEventListener('DOMContentLoaded', function() {
            {% block dom_ready %}{% endblock %}
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('login.serve_shared_static_endpoint', filename='js/shared.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
