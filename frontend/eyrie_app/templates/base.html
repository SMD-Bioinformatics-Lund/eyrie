<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eyrie Sample Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/shared/static/css/styles.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark bg-dark border-0">
        <div class="container-fluid">
            <div class="d-flex align-items-center justify-content-between w-100">
                <div class="d-flex align-items-center">
                    <span class="navbar-brand mb-0 h1 me-4">
                        {% block navbar_brand %}
                        <i class="bi bi-dna me-2"></i>Eyrie Sample Manager
                        {% endblock %}
                    </span>
                    <a href="/samples" class="btn {% if request.endpoint == 'samples.index' %}btn-light{% else %}btn-outline-light{% endif %} me-3">
                        <i class="bi bi-table me-2"></i>Samples
                    </a>
                    <a href="/trends" class="btn {% if request.endpoint == 'trends.trends' %}btn-light{% else %}btn-outline-light{% endif %} me-3">
                        <i class="bi bi-graph-up me-2"></i>Trends
                    </a>
                    <a href="/admin" class="btn {% if request.endpoint == 'admin.dashboard' %}btn-light{% else %}btn-outline-light{% endif %} me-3" id="adminButton">
                        <i class="bi bi-gear me-2"></i>Admin
                    </a>
                </div>
                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-2"></i><span id="currentUsername">Loading...</span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><button class="dropdown-item" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script>
        // API base URL
        window.API_BASE = '/api';

        // Shared authentication functions
        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/auth/current-user', {
                    credentials: 'include'
                });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('currentUsername').textContent = user.username;
                    
                    // Show/hide admin button based on role
                    const adminButton = document.getElementById('adminButton');
                    if (user.role !== 'admin') {
                        adminButton.style.display = 'none';
                    }
                    
                    {% block user_loaded %}{% endblock %}
                } else {
                    {% block auth_failed %}
                    // Default behavior for auth failure
                    document.getElementById('currentUsername').textContent = 'Unknown';
                    {% endblock %}
                }
            } catch (error) {
                console.error('Failed to load user:', error);
                document.getElementById('currentUsername').textContent = 'Unknown';
            }
        }

        async function logout() {
            try {
                await fetch('/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/login';
            }
        }

        // Initialize shared functionality
        document.addEventListener('DOMContentLoaded', function() {
            loadCurrentUser();
            {% block dom_ready %}{% endblock %}
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/shared/static/js/shared.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
