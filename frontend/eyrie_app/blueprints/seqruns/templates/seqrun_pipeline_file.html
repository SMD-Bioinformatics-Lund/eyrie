{% extends "base.html" %}

{% block title %}Pipeline File Error - {{ seqrun_id }} | Eyrie{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 class="mb-1">
                        <i class="bi bi-file-earmark-bar-graph text-primary me-2"></i>
                        Pipeline File Error
                    </h2>
                    <p class="text-muted mb-0">
                        <i class="bi bi-collection me-1"></i>
                        Sequencing Run: {{ seqrun_id }}
                    </p>
                </div>
                <div>
                    <a href="{{ url_for('seqruns.seqrun_information', seqrun_id=seqrun_id) }}" 
                       class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Back to Pipeline Files
                    </a>
                </div>
            </div>

            <!-- Error Display Only -->
            <div class="card border-danger">
                <div class="card-body text-center py-5">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                    <h5 class="text-danger mt-3">Failed to Load Pipeline File</h5>
                    <p class="text-muted">{{ error }}</p>
                    <a href="{{ url_for('seqruns.seqrun_information', seqrun_id=seqrun_id) }}" 
                       class="btn btn-primary">
                        <i class="bi bi-arrow-left me-1"></i>Return to Pipeline Files
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
