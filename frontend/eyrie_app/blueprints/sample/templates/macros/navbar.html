{% macro sample_navbar(sample_id, active_tab='overview', current_user=None) %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-0">
    <div class="container-fluid">
        <a href="{{ url_for('samples.samples_page') }}" class="navbar-brand mb-0 h1">
            <i class="bi bi-arrow-left me-2"></i>Back to Samples
        </a>
        <span class="navbar-text me-3" id="sampleTitle">
            Loading sample...
        </span>

        <div class="navbar-nav me-auto">
            <a class="nav-link {{ 'active' if active_tab == 'overview' else '' }}" href="{{ url_for('sample.sample_overview', sample_id=sample_id) }}" id="overviewLink">
                <i class="bi bi-table me-2"></i>Overview
            </a>
            <a class="nav-link {{ 'active' if active_tab == 'classification' else '' }}" href="{{ url_for('sample.sample_classification', sample_id=sample_id) }}" id="classificationLink">
                <i class="bi bi-pie-chart me-2"></i>Classification
            </a>
            <a class="nav-link {{ 'active' if active_tab == 'nanoplot' else '' }}" href="{{ url_for('sample.sample_nanoplot', sample_id=sample_id) }}" id="nanoplotLink">
                <i class="bi bi-graph-up me-2"></i>Nanoplot
            </a>
        </div>

        <div class="d-flex align-items-center">
            {% if current_user and current_user.role == 'admin' %}
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-light me-3">
                <i class="bi bi-gear me-2"></i>Admin
            </a>
            {% endif %}
            <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-2"></i><span id="currentUsername">{% if current_user %}{{ current_user.username }}{% else %}Loading...{% endif %}</span>
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="{{ url_for('login.logout') }}">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>
{% endmacro %}
