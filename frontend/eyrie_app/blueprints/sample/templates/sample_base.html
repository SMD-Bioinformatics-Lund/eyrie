<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eyrie{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('login.serve_shared_static_endpoint', filename='css/styles.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sample views have their own navbar, no main navbar here -->
    {% block content %}{% endblock %}

    <script>
        // Sample API URL templates - use Flask url_for for proper base path handling
        window.SAMPLE_API_TEMPLATES = {
            get: '{{ url_for("sample.get_sample_api", sample_id="__SAMPLE_ID__") }}',
            qc: '{{ url_for("sample.update_qc_api", sample_id="__SAMPLE_ID__") }}',
            comment: '{{ url_for("sample.update_comment_api", sample_id="__SAMPLE_ID__") }}',
            speciesFlags: '{{ url_for("sample.update_species_flags_api", sample_id="__SAMPLE_ID__") }}'
        };

        window.DATA_URL_TEMPLATE = '{{ url_for("sample.serve_data_file_endpoint", file_path="__FILE_PATH__") }}';

        // Helper function to build analysis file URLs  
        window.getDataFileUrl = function(filePath) {
            return window.DATA_URL_TEMPLATE.replace('__FILE_PATH__', filePath);
        };

        // Backward compatibility for legacy code
        window.getBasePath = function() {
            return '';
        };

        // Helper function to build URLs for specific samples
        window.getSampleApiUrl = function(operation, sampleId) {
            const template = window.SAMPLE_API_TEMPLATES[operation];
            if (!template) {
                console.error('Unknown API operation:', operation);
                return null;
            }
            return template.replace('__SAMPLE_ID__', sampleId);
        };

        // Initialize shared functionality
        document.addEventListener('DOMContentLoaded', function() {
            {% block dom_ready %}{% endblock %}
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('login.serve_shared_static_endpoint', filename='js/shared.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
