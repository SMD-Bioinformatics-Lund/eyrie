{% extends "admin_base.html" %}

{% block title %}Create User - Eyrie{% endblock %}

{% block admin_content %}
<div class="row">
    <div class="col-xl-6 col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-eyrie-green text-white">
                <i class="bi bi-person-plus me-2"></i>Add User
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.create_user') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               value="{{ form_data.username if form_data else '' }}"
                               required
                               autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               value="{{ form_data.email if form_data else '' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-select" id="role" name="role">
                            <option value="user" {% if form_data and form_data.role == 'user' %}selected{% endif %}>User</option>
                            <option value="uploader" {% if form_data and form_data.role == 'uploader' %}selected{% endif %}>Uploader</option>
                            <option value="admin" {% if form_data and form_data.role == 'admin' %}selected{% endif %}>Admin</option>
                        </select>
                        <div class="form-text">
                            <strong>User:</strong> View samples only<br>
                            <strong>Uploader:</strong> View and upload samples<br>
                            <strong>Admin:</strong> Full system access
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-2"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-person-plus me-2"></i>Create User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
