# Apache Proxy Configuration for Eyrie
# This configuration should be included in your Apache virtual host

# Enable required Apache modules:
# a2enmod proxy
# a2enmod proxy_http
# a2enmod headers

# Eyrie Backend API Proxy
# Routes all /eyrie/api requests to the FastAPI backend
ProxyPass /eyrie/api http://127.0.0.1:5809/api
ProxyPassReverse /eyrie/api http://127.0.0.1:5809/api

# Eyrie Frontend Proxy
# Routes all /eyrie requests to the Flask frontend
ProxyPass /eyrie http://127.0.0.1:5810/eyrie
ProxyPassReverse /eyrie http://127.0.0.1:5810/eyrie

# Optional: Add headers for better proxy handling
ProxyPreserveHost On
ProxyAddHeaders On

# Optional: WebSocket support (if needed in future)
# RewriteEngine On
# RewriteCond %{HTTP:Upgrade} websocket [NC]
# RewriteCond %{HTTP:Connection} upgrade [NC]
# RewriteRule ^/eyrie/(.*)$ "ws://127.0.0.1:5821/eyrie/$1" [P,L]

# Optional: Set timeout values
# ProxyTimeout 300
# ProxyBadHeader Ignore

# Example Virtual Host Configuration:
# <VirtualHost *:80>
#     ServerName your-domain.com
#     DocumentRoot /var/www/html
#     
#     # Include this configuration
#     Include /path/to/apache-proxy.conf
#     
#     # Optional: Logging
#     ErrorLog ${APACHE_LOG_DIR}/eyrie_error.log
#     CustomLog ${APACHE_LOG_DIR}/eyrie_access.log combined
# </VirtualHost>